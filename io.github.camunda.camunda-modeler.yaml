app-id: io.github.camunda.camunda-modeler
runtime: org.freedesktop.Platform
runtime-version: '24.08'
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
build-options:
  append-path: /usr/lib/sdk/node22/bin
command: run.sh
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --device=dri
  - --filesystem=home
env:
  NPM_CONFIG_LOGLEVEL: info

add-extensions:
  com.camunda.Modeler.Plugin:
    directory: plugins
    subdirectories: true
    no-autodownload: true
    autodelete: true

modules:
  - name: camunda-modeler
    buildsystem: simple
    build-options:
      env:
        XDG_CACHE_HOME: /run/build/camunda-modeler/flatpak-node/cache
        npm_config_cache: /run/build/camunda-modeler/flatpak-node/npm-cache
        npm_config_nodedir: /usr/lib/sdk/node22
        npm_config_offline: 'true'
    build-commands:
      - mkdir -p /app/share/camunda-modeler
      - npm install --offline
      - npm run all
      - npm run build
      - cp -r camunda-modeler/* /app/share/camunda-modeler/
      - install -Dm644 ${FLATPAK_ID}.desktop -t /app/share/applications
      - install -Dm644 ${FLATPAK_ID}.appdata.xml -t /app/share/appdata
      - install -Dm755 run.sh /app/bin/run.sh
      - install -Dm644 camunda-modeler/support/icon_16.png /app/share/icons/hicolor/16x16/apps/${FLATPAK_ID}.png
      - install -Dm644 camunda-modeler/support/icon_48.png /app/share/icons/hicolor/48x48/apps/${FLATPAK_ID}.png
      - install -Dm644 camunda-modeler/support/icon_128.png /app/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
      - mkdir -p /app/plugins
    subdir: share
    sources:
      - type: git
        url: https://github.com/camunda/camunda-modeler.git
        tag: v5.32.0
        commit: ddb8d9e926864679cf061062162495e5b8ca2679
        dest: share
      - type: file
        path: io.github.camunda.camunda-modeler.desktop
      - type: file
        path: io.github.camunda.camunda-modeler.appdata.xml
      - generated-sources.json
      - type: script
        dest-filename: run.sh
        commands:
          - zypak-wrapper /app/share/camunda-modeler/camunda-modeler "$@"
